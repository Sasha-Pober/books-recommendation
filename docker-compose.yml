# Local environment: the store (frontend + API), its data stores and the recommendation service.
# Open http://localhost:4200.
services:
  postgres:
    # pgvector + Ukrainian full-text search dictionary, see infra/postgres/Dockerfile
    build:
      context: ./infra/postgres
    image: bookstore-postgres:17
    container_name: bookstore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookstore}
      POSTGRES_USER: ${POSTGRES_USER:-bookstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookstore}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bookstore-redis
    # Cache only (precomputed recommendation collections): no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  recsys:
    build:
      context: ./recsys
    container_name: bookstore-recsys
    environment:
      RECSYS_DATABASE_URL: postgresql://${POSTGRES_USER:-bookstore}:${POSTGRES_PASSWORD:-bookstore}@postgres:5432/${POSTGRES_DB:-bookstore}
      RECSYS_SERVICE_KEY: ${RECSYS_SERVICE_KEY:-dev-recsys-service-key-change-me}
      # The text model for books added after training is downloaded here on first need (~0.5 GB, once).
      HF_HOME: /app/hf-cache
    # No published port: only the API calls it, over the internal network.
    expose:
      - "8000"
    volumes:
      # Models imported on the host with `uv run recsys import-model` (read-only for the service).
      - ./recsys/artifacts:/app/artifacts:ro
      - recsys-hf-cache:/app/hf-cache
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    container_name: bookstore-api
    environment:
      # Development: applies migrations + seeds demo data on startup and serves the Scalar UI.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookStore: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-bookstore};Username=${POSTGRES_USER:-bookstore};Password=${POSTGRES_PASSWORD:-bookstore};Minimum Pool Size=4
      # Short timeouts: when Redis is down the API falls back to the database quickly.
      # Requests come through the frontend's nginx: trust its X-Forwarded-For (Docker's private networks).
      ReverseProxy__TrustedNetworks__0: 172.16.0.0/12
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=1000,asyncTimeout=200,syncTimeout=200
      # The Python recommendation service; without a trained model it answers 503 and the API uses its fallback.
      RecommendationService__BaseUrl: http://recsys:8000/
      RecommendationService__ServiceKey: ${RECSYS_SERVICE_KEY:-dev-recsys-service-key-change-me}
    ports:
      - "5292:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: bookstore-frontend
    # nginx: the Angular app, and /api proxied to the API (same origin for the browser).
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres-data:
  recsys-hf-cache:
