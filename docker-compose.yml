# Local development environment. The frontend will be added here when it is implemented.
services:
  postgres:
    # pgvector + Ukrainian full-text search dictionary, see infra/postgres/Dockerfile
    build:
      context: ./infra/postgres
    image: bookstore-postgres:17
    container_name: bookstore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookstore}
      POSTGRES_USER: ${POSTGRES_USER:-bookstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookstore}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bookstore-redis
    # Cache only (precomputed recommendation collections): no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  recsys:
    build:
      context: ./recsys
    container_name: bookstore-recsys
    environment:
      RECSYS_DATABASE_URL: postgresql://${POSTGRES_USER:-bookstore}:${POSTGRES_PASSWORD:-bookstore}@postgres:5432/${POSTGRES_DB:-bookstore}
      RECSYS_SERVICE_KEY: ${RECSYS_SERVICE_KEY:-dev-recsys-service-key-change-me}
    # No published port: only the API calls it, over the internal network.
    expose:
      - "8000"
    volumes:
      - recsys-artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
    container_name: bookstore-api
    environment:
      # Development: applies migrations + seeds demo data on startup and serves the Scalar UI.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__BookStore: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-bookstore};Username=${POSTGRES_USER:-bookstore};Password=${POSTGRES_PASSWORD:-bookstore}
      # Short timeouts: when Redis is down the API falls back to the database quickly.
      ConnectionStrings__Redis: redis:6379,abortConnect=false,connectTimeout=1000,asyncTimeout=200,syncTimeout=200
      # The Python recommendation service; without a trained model it answers 503 and the API uses its fallback.
      RecommendationService__BaseUrl: http://recsys:8000/
      RecommendationService__ServiceKey: ${RECSYS_SERVICE_KEY:-dev-recsys-service-key-change-me}
    ports:
      - "5292:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  recsys-artifacts:
