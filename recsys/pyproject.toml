[project]
name = "recsys"
version = "0.1.0"
description = "Hybrid neural recommendation service for the book store (FastAPI + PyTorch)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
recsys = "recsys:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Starlette suggests a successor package for its test client; httpx still works.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
